version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:3001
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost:5173
      - GATEWAY_URL=http://gateway:3000
    depends_on:
      - gateway

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./gateway/.env
    environment:
      - MCP_SQL_URL=http://mcp-sql:3002
    depends_on:
      - mcp-sql

  mcp-sql:
    build:
      context: ./mcp-sql
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - ./mcp-sql/.env

networks:
  default:
    driver: bridge
